name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMPDIR: /var/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - run: python .ci/sync_upstream.py --check
  native:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        go: [stable]
        os: [ubuntu-latest, windows-latest]
        include:
          - go: "1.26.x"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go vet ./...
      - run: go test ./...
        env:
          CGO_ENABLED: "0"
      - run: go test -race ./...
        if: runner.os == 'Linux'
